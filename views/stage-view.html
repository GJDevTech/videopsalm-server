<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stage Cue</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body { display: grid; place-items: center; }
    #stage {
      position: relative;
      width: min(100vw, 177.7778vh);
      height: min(56.25vw, 100vh);
      overflow: hidden;
      background: #000;
    }
    #text-box {
      position: absolute;
      display: flex;
      overflow: visible;
    }
    #lyrics {
      white-space: pre;
      line-height: 1.12;
    }
    #upcoming {
      position: absolute;
      left: 5%;
      bottom: 2%;
      width: 90%;
      height: 27%;
      display: none;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 0.35vh;
      overflow: hidden;
    }
    .upcoming-slide {
      width: 100%;
      white-space: pre;
      line-height: 1.12;
      text-align: center;
      color: #A7B0BC;
    }
    #status {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 10;
      display: none;
      max-width: min(420px, calc(100vw - 24px));
      padding: 8px 10px;
      border-radius: 6px;
      color: #fff;
      background: rgba(153, 27, 27, 0.92);
      font: 14px/1.35 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main id="stage" aria-live="polite">
    <div id="text-box"><div id="lyrics"></div></div>
    <div id="upcoming"></div>
  </main>
  <div id="status" role="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const churchPattern = /^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$/;
    const pathMatch = location.pathname.match(/^\/stage-view\/([^/]+)\/?$/);
    const params = new URLSearchParams(location.search);
    let churchId = "";
    try {
      churchId = pathMatch ? decodeURIComponent(pathMatch[1]) : (params.get("churchId") || "");
    } catch (_error) {
      churchId = "";
    }

    const stage = document.getElementById("stage");
    const box = document.getElementById("text-box");
    const lyrics = document.getElementById("lyrics");
    const upcomingBox = document.getElementById("upcoming");
    const status = document.getElementById("status");
    let cue = null;

    function value(settings, key, fallback) {
      return settings[key] === undefined ? fallback : settings[key];
    }

    function showStatus(message) {
      status.textContent = message;
      status.style.display = message ? "block" : "none";
    }

    function fitElementText(element, container, maxSize) {
      let low = 1;
      let high = Math.max(1, Math.round(maxSize));
      let best = 1;
      while (low <= high) {
        const size = Math.floor((low + high) / 2);
        element.style.fontSize = `${size}px`;
        if (element.scrollWidth <= container.clientWidth && element.scrollHeight <= container.clientHeight) {
          best = size;
          low = size + 1;
        } else {
          high = size - 1;
        }
      }
      element.style.fontSize = `${best}px`;
    }

    function render() {
      if (!cue) return;
      const settings = cue.settings || {};
      const blackout = cue.mode === "BLACKOUT";
      const clear = cue.mode === "CLEAR" || cue.mode === "READY";
      const scale = stage.clientWidth / 1920;
      stage.style.background = blackout
        ? "#000000"
        : value(settings, "backgroundColor", "#000000");
      box.style.left = `${value(settings, "textBoxX", 5)}%`;
      box.style.top = `${value(settings, "textBoxY", 25)}%`;
      box.style.width = `${value(settings, "textBoxWidth", 90)}%`;
      box.style.height = `${value(settings, "textBoxHeight", 50)}%`;

      const horizontal = value(settings, "textHorizontalAlign", "center");
      const vertical = value(settings, "textVerticalAlign", "center");
      box.style.justifyContent = {
        left: "flex-start",
        center: "center",
        right: "flex-end",
      }[horizontal] || "center";
      box.style.alignItems = {
        top: "flex-start",
        center: "center",
        bottom: "flex-end",
      }[vertical] || "center";

      lyrics.textContent = blackout || clear || cue.textHidden
        ? ""
        : String(cue.text || "");
      lyrics.style.fontFamily = value(settings, "fontFamily", "Arial");
      lyrics.style.fontWeight = value(settings, "bold", true) ? "700" : "400";
      lyrics.style.fontStyle = value(settings, "italic", false) ? "italic" : "normal";
      lyrics.style.color = value(settings, "textColor", "#FFFFFF");
      lyrics.style.textAlign = horizontal;
      const outline = value(settings, "outlineEnabled", false)
        ? Math.max(0, Number(value(settings, "outlineWidth", 0))) * scale
        : 0;
      lyrics.style.webkitTextStroke = `${outline}px ${value(settings, "outlineColor", "#000000")}`;
      lyrics.style.textShadow = value(settings, "shadowEnabled", true)
        ? `${Number(value(settings, "shadowOffsetX", 3)) * scale}px ` +
          `${Number(value(settings, "shadowOffsetY", 3)) * scale}px ` +
          `${value(settings, "shadowColor", "#000000")}`
        : "none";
      fitElementText(lyrics, box, Number(value(settings, "fontSize", 54)) * scale);

      let count = Number(value(settings, "nextSlideCount", value(settings, "showNextSlide", false) ? 1 : 0));
      count = Math.max(0, Math.min(5, Number.isFinite(count) ? Math.floor(count) : 0));
      const supplied = Array.isArray(cue.upcomingSlides)
        ? cue.upcomingSlides
        : (cue.nextText ? [{ text: cue.nextText, segment: cue.nextSegment || "" }] : []);
      const upcoming = supplied.slice(0, count);
      const showUpcoming = !blackout && !clear && !cue.textHidden && upcoming.length > 0;
      upcomingBox.replaceChildren();
      upcomingBox.style.display = showUpcoming ? "flex" : "none";
      if (showUpcoming) {
        upcoming.forEach((slide, index) => {
          const element = document.createElement("div");
          element.className = "upcoming-slide";
          element.textContent = String(slide?.text || "");
          element.style.fontFamily = value(settings, "fontFamily", "Arial");
          element.style.fontWeight = value(settings, "bold", true) ? "700" : "400";
          element.style.fontStyle = value(settings, "italic", false) ? "italic" : "normal";
          element.style.opacity = String(Math.max(0.38, 0.86 - index * 0.12));
          upcomingBox.appendChild(element);
          const relativeSize = 0.50 * Math.pow(0.82, index);
          fitElementText(
            element,
            upcomingBox,
            Math.max(13, Number(value(settings, "fontSize", 54)) * relativeSize) * scale,
          );
        });
      }
    }

    if (!churchPattern.test(churchId)) {
      showStatus("This stage-view URL does not contain a valid church ID.");
    } else {
      document.title = `Stage Cue · ${churchId}`;
      const socket = io({ auth: { churchId } });
      socket.on("connect", () => showStatus(""));
      socket.on("disconnect", () => showStatus("Stage Cue is reconnecting…"));
      socket.on("instance-error", data => showStatus(String(data?.error || "Invalid church presentation.")));
      socket.on("cue-update", data => {
        cue = data;
        render();
      });
    }
    addEventListener("resize", render);
  </script>
</body>
</html>
